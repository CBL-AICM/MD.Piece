<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1920" viewBox="0 0 1600 1920" font-family="Microsoft JhengHei, PMingLiU, sans-serif">
  <rect width="1600" height="1920" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L12 6 L0 12 Z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 15 directed connections, drawn behind all boxes. -->
  <g fill="none" stroke="#374151" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
    <path id="source-to-1" d="M800 280 V340"/>
    <path id="1-to-2" d="M560 580 V620 H290 V660"/>
    <path id="1-to-3" d="M800 580 V660"/>
    <path id="1-to-4" d="M1040 580 V620 H1310 V660"/>
    <path id="2-to-method" d="M290 920 V950 H620 V980"/>
    <path id="3-to-method" d="M800 920 V980"/>
    <path id="4-to-method" d="M1310 920 V950 H980 V980"/>
    <path id="method-to-5" d="M620 1190 V1220 H223 V1280"/>
    <path id="method-to-7" d="M980 1190 V1220 H993 V1280"/>
    <path d="M20 1265 H201 C201 1241 245 1241 245 1265 H608" stroke="#ffffff" stroke-width="13" marker-end="none"/>
    <path id="1-to-6" d="M260 460 H20 V1265 H201 C201 1241 245 1241 245 1265 H608 V1280"/>
    <path id="1-to-8" d="M1340 460 H1580 V1245 H1378 V1280"/>
    <path id="5-to-conclusion" d="M223 1700 V1760 H650 V1780"/>
    <path id="6-to-conclusion" d="M608 1700 V1730 H750 V1780"/>
    <path id="7-to-conclusion" d="M993 1700 V1730 H850 V1780"/>
    <path id="8-to-conclusion" d="M1378 1700 V1760 H950 V1780"/>
  </g>

  <g id="source">
    <rect x="370" y="30" width="860" height="250" rx="16" fill="#f5f7fa" stroke="#475569" stroke-width="3"/>
    <text x="800" y="76" text-anchor="middle" font-size="38" font-weight="700" fill="#172033">資料來源</text>
    <text x="800" y="120" text-anchor="middle" font-size="28" fill="#172033">
      <tspan x="800">NHANES 公開資料</tspan>
      <tspan x="800" dy="37">開發：1999–2018 年（十個週期）</tspan>
      <tspan x="800" dy="37">外部：2021–2023 年</tspan>
      <tspan x="800" dy="37">NIH GEO 腎臟切片轉錄體（病理確診）</tspan>
    </text>
  </g>

  <g id="purpose-1">
    <rect x="260" y="340" width="1080" height="240" rx="16" fill="#f5f7fa" stroke="#475569" stroke-width="3"/>
    <text x="800" y="395" text-anchor="middle" font-size="38" font-weight="700" fill="#172033">目的一　建立可回推的資料基礎</text>
    <text x="800" y="452" text-anchor="middle" font-size="30" fill="#172033">
      <tspan x="800">依官方文件校正跨週期檢驗量尺</tspan>
      <tspan x="800" dy="43">腎損傷＝eGFR &lt; 60 或 ACR ≧ 30</tspan>
      <tspan x="800" dy="43">三個病因方向之三值標籤（陽性／陰性／未知）</tspan>
    </text>
  </g>

  <g id="purpose-2">
    <rect x="70" y="660" width="440" height="260" rx="14" fill="#fff5ef" stroke="#eb6834" stroke-width="3.5"/>
    <text x="290" y="718" text-anchor="middle" font-size="34" font-weight="700" fill="#172033">目的二　回推代謝方向</text>
    <text x="290" y="800" text-anchor="middle" font-size="30" fill="#172033">標籤：糖尿病</text>
  </g>

  <g id="purpose-3">
    <rect x="580" y="660" width="440" height="260" rx="14" fill="#f0f6ff" stroke="#2a78d6" stroke-width="3.5"/>
    <text x="800" y="718" text-anchor="middle" font-size="34" font-weight="700" fill="#172033">目的三　回推感染方向</text>
    <text x="800" y="788" text-anchor="middle" font-size="30" fill="#172033">
      <tspan x="800">標籤：病毒性肝炎</tspan>
      <tspan x="800" dy="43">B 型、C 型分開檢驗</tspan>
    </text>
  </g>

  <g id="purpose-4">
    <rect x="1090" y="660" width="440" height="260" rx="14" fill="#f5f1fa" stroke="#7955a6" stroke-width="3.5"/>
    <text x="1310" y="710" text-anchor="middle" font-size="34" font-weight="700" fill="#172033">目的四　回推免疫方向</text>
    <text x="1310" y="758" text-anchor="middle" font-size="27" fill="#172033">
      <tspan x="1310">標籤：抗核抗體</tspan>
      <tspan x="1310" dy="37">1999–2004 年次樣本</tspan>
      <tspan x="1310" dy="37">腎臟切片轉錄體：</tspan>
      <tspan x="1310" dy="37">同一處理批次內比較</tspan>
    </text>
  </g>

  <g id="common-method">
    <rect x="420" y="980" width="760" height="210" rx="14" fill="#f5f7fa" stroke="#475569" stroke-width="3"/>
    <text x="800" y="1027" text-anchor="middle" font-size="38" font-weight="700" fill="#172033">共同方法</text>
    <text x="800" y="1071" text-anchor="middle" font-size="28" fill="#172033">
      <tspan x="800">常規血液與尿液檢驗</tspan>
      <tspan x="800" dy="38">邏輯迴歸（線性）與梯度提升（非線性）</tspan>
      <tspan x="800" dy="38">巢狀交叉驗證：判別力、校準</tspan>
    </text>
  </g>

  <g id="purpose-5">
    <rect x="40" y="1280" width="365" height="420" rx="14" fill="#f5f7fa" stroke="#475569" stroke-width="3"/>
    <text x="223" y="1330" text-anchor="middle" font-size="30" font-weight="700" fill="#172033">
      <tspan x="223">目的五　檢驗回推的</tspan><tspan x="223" dy="38">可靠度與用途</tspan>
    </text>
    <text x="64" y="1425" font-size="26" fill="#172033">
      <tspan x="64">與只用年齡、性別比較</tspan>
      <tspan x="64" dy="39">時間外推、人口加權、</tspan><tspan x="64" dy="36">標籤定義</tspan>
      <tspan x="64" dy="39">2021–2023 年外部資料</tspan>
      <tspan x="64" dy="39">決策曲線</tspan>
    </text>
  </g>

  <g id="purpose-6">
    <rect x="425" y="1280" width="365" height="420" rx="14" fill="#f5f7fa" stroke="#475569" stroke-width="3"/>
    <text x="608" y="1330" text-anchor="middle" font-size="30" font-weight="700" fill="#172033">
      <tspan x="608">目的六　界定</tspan><tspan x="608" dy="38">「找原因」的邊界</tspan>
    </text>
    <text x="449" y="1430" font-size="26" fill="#172033">
      <tspan x="449">上游暴露掃描</tspan><tspan x="449" dy="38">（偽發現率校正）</tspan>
      <tspan x="449" dy="54">能通過雜湊檢查的</tspan><tspan x="449" dy="38">資料錯誤</tspan>
    </text>
  </g>

  <g id="purpose-7">
    <rect x="810" y="1280" width="365" height="420" rx="14" fill="#f5f7fa" stroke="#475569" stroke-width="3"/>
    <text x="993" y="1330" text-anchor="middle" font-size="30" font-weight="700" fill="#172033">
      <tspan x="993">目的七　把回推結果</tspan><tspan x="993" dy="38">做成工具</tspan>
    </text>
    <text x="834" y="1430" font-size="26" fill="#172033">
      <tspan x="834">離線網頁工具：</tspan><tspan x="834" dy="38">逐項顯示推動因子</tspan>
      <tspan x="834" dy="54">重新校準之</tspan><tspan x="834" dy="38">交叉驗證</tspan>
    </text>
  </g>

  <g id="purpose-8">
    <rect x="1195" y="1280" width="365" height="420" rx="14" fill="#f5f7fa" stroke="#475569" stroke-width="3"/>
    <text x="1378" y="1330" text-anchor="middle" font-size="30" font-weight="700" fill="#172033">
      <tspan x="1378">目的八　比較九種</tspan><tspan x="1378" dy="38">候選病因</tspan>
    </text>
    <text x="1219" y="1425" font-size="26" fill="#172033">
      <tspan x="1219">代謝、免疫、感染</tspan><tspan x="1219" dy="36">各三種</tspan>
      <tspan x="1219" dy="43">腎損傷與無腎損傷</tspan><tspan x="1219" dy="36">之盛行率比</tspan>
      <tspan x="1219" dy="43">依腎臟型態分別比較</tspan>
    </text>
  </g>

  <g id="conclusion">
    <rect x="400" y="1780" width="800" height="120" rx="16" fill="#f5f7fa" stroke="#475569" stroke-width="3"/>
    <text x="800" y="1823" text-anchor="middle" font-size="36" font-weight="700" fill="#172033">結論</text>
    <text x="800" y="1870" text-anchor="middle" font-size="28" fill="#172033">三個病因方向各能否由常規檢驗回推</text>
  </g>
</svg>
