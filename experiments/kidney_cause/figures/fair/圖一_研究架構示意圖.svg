<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1920" viewBox="0 0 1600 1920" font-family="Microsoft JhengHei, PMingLiU, sans-serif">
  <rect width="1600" height="1920" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#374151"/>
    </marker>
  </defs>

  <!-- Exactly thirteen directed connections. The bridge is a crossing, not a junction. -->
  <g fill="none" stroke="#374151" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
    <path id="A-B" d="M800 270 V350"/>
    <path id="B-C1" d="M530 590 V625 H320 V670"/>
    <path id="B-C2" d="M800 590 V670"/>
    <path id="B-C3" d="M1070 590 V625 H1280 V670"/>
    <path id="C1-D" d="M320 870 V930"/>
    <path id="C2-D" d="M800 870 V930"/>
    <path id="C3-D" d="M1280 870 V930"/>
    <path id="B-F" d="M1330 470 H1545 V1200 H800 V1280"/>
    <path id="D-E" d="M320 1140 V1280"/>
    <path id="E-H" d="M320 1650 V1695 H620 V1750"/>
    <path id="F-H" d="M800 1650 V1750"/>
    <path id="G-H" d="M1280 1650 V1695 H980 V1750"/>
  </g>
  <!-- White clearance makes the D→G bridge unambiguous in monochrome. -->
  <path d="M1280 1178 C1256 1178 1256 1222 1280 1222" fill="none" stroke="#ffffff" stroke-width="13"/>
  <path id="D-G" d="M1280 1140 V1178 C1256 1178 1256 1222 1280 1222 V1280" fill="none" stroke="#374151" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g id="A">
    <rect x="370" y="50" width="860" height="220" rx="16" fill="#f5f7fa" stroke="#475569" stroke-width="3"/>
    <text x="800" y="104" text-anchor="middle" font-size="40" font-weight="700" fill="#172033">資料來源</text>
    <text x="800" y="153" text-anchor="middle" font-size="32" fill="#172033">
      <tspan x="800">NHANES 公開資料</tspan>
      <tspan x="800" dy="43">開發：1999–2018 年（十個週期）</tspan>
      <tspan x="800" dy="43">外部：2021–2023 年</tspan>
    </text>
  </g>

  <g id="B">
    <rect x="270" y="350" width="1060" height="240" rx="16" fill="#f5f7fa" stroke="#475569" stroke-width="3"/>
    <text x="800" y="408" text-anchor="middle" font-size="38" font-weight="700" fill="#172033">目的一　建立可回推的資料基礎</text>
    <text x="800" y="463" text-anchor="middle" font-size="32" fill="#172033">
      <tspan x="800">依官方文件校正跨週期檢驗量尺</tspan>
      <tspan x="800" dy="46">腎炎（腎損傷）＝ eGFR &lt; 60 或 ACR ≧ 30</tspan>
      <tspan x="800" dy="46">三個病因方向之三值標籤（陽性／陰性／未知）</tspan>
    </text>
  </g>

  <g id="C1">
    <rect x="95" y="670" width="450" height="200" rx="14" fill="#fff5ef" stroke="#eb6834" stroke-width="3.5"/>
    <text x="320" y="728" text-anchor="middle" font-size="36" font-weight="700" fill="#172033">目的二　回推代謝方向</text>
    <text x="320" y="798" text-anchor="middle" font-size="32" fill="#172033">標籤：糖尿病</text>
  </g>
  <g id="C2">
    <rect x="575" y="670" width="450" height="200" rx="14" fill="#f0f6ff" stroke="#2a78d6" stroke-width="3.5"/>
    <text x="800" y="728" text-anchor="middle" font-size="36" font-weight="700" fill="#172033">目的三　回推感染方向</text>
    <text x="800" y="788" text-anchor="middle" font-size="32" fill="#172033">
      <tspan x="800">標籤：病毒性肝炎</tspan>
      <tspan x="800" dy="45">B 型、C 型分開檢驗</tspan>
    </text>
  </g>
  <g id="C3">
    <rect x="1055" y="670" width="450" height="200" rx="14" fill="#f5f1fa" stroke="#7955a6" stroke-width="3.5"/>
    <text x="1280" y="728" text-anchor="middle" font-size="36" font-weight="700" fill="#172033">目的四　回推免疫方向</text>
    <text x="1280" y="788" text-anchor="middle" font-size="32" fill="#172033">
      <tspan x="1280">標籤：抗核抗體</tspan>
      <tspan x="1280" dy="45">1999–2004 年次樣本</tspan>
    </text>
  </g>

  <g id="D">
    <rect x="95" y="930" width="1410" height="210" rx="14" fill="#f5f7fa" stroke="#475569" stroke-width="3"/>
    <text x="800" y="983" text-anchor="middle" font-size="38" font-weight="700" fill="#172033">共同方法</text>
    <text x="800" y="1030" text-anchor="middle" font-size="32" fill="#172033">
      <tspan x="800">常規血液與尿液檢驗</tspan>
      <tspan x="800" dy="43">邏輯迴歸（線性）與梯度提升（非線性）</tspan>
      <tspan x="800" dy="43">巢狀交叉驗證：判別力、校準</tspan>
    </text>
  </g>

  <g id="E">
    <rect x="95" y="1280" width="450" height="370" rx="14" fill="#ffffff" stroke="#475569" stroke-width="3"/>
    <text x="320" y="1335" text-anchor="middle" font-size="36" font-weight="700" fill="#172033"><tspan x="320">目的五　檢驗回推的</tspan><tspan x="320" dy="46">可靠度與用途</tspan></text>
    <text x="119" y="1440" font-size="30" fill="#172033">與只用年齡、性別比較</text>
    <text x="119" y="1484" font-size="30" fill="#172033"><tspan x="119">時間外推、人口加權、</tspan><tspan x="119" dy="39">標籤定義</tspan></text>
    <text x="119" y="1567" font-size="30" fill="#172033">2021–2023 年外部資料</text>
    <text x="119" y="1611" font-size="30" fill="#172033">決策曲線</text>
  </g>
  <g id="F">
    <rect x="575" y="1280" width="450" height="370" rx="14" fill="#ffffff" stroke="#475569" stroke-width="3"/>
    <text x="800" y="1335" text-anchor="middle" font-size="36" font-weight="700" fill="#172033"><tspan x="800">目的六　界定</tspan><tspan x="800" dy="46">「找原因」的邊界</tspan></text>
    <text x="599" y="1440" font-size="30" fill="#172033"><tspan x="599">上游暴露掃描</tspan><tspan x="599" dy="39">（偽發現率校正）</tspan></text>
    <text x="599" y="1540" font-size="30" fill="#172033"><tspan x="599">能通過雜湊檢查的</tspan><tspan x="599" dy="39">資料錯誤</tspan></text>
  </g>
  <g id="G">
    <rect x="1055" y="1280" width="450" height="370" rx="14" fill="#ffffff" stroke="#475569" stroke-width="3"/>
    <text x="1280" y="1335" text-anchor="middle" font-size="36" font-weight="700" fill="#172033"><tspan x="1280">目的七　把回推結果</tspan><tspan x="1280" dy="46">做成工具</tspan></text>
    <text x="1079" y="1440" font-size="30" fill="#172033"><tspan x="1079">離線網頁工具：</tspan><tspan x="1079" dy="39">逐項顯示推動因子</tspan></text>
    <text x="1079" y="1540" font-size="30" fill="#172033">重新校準之交叉驗證</text>
  </g>

  <g id="H">
    <rect x="320" y="1750" width="960" height="120" rx="16" fill="#f5f7fa" stroke="#475569" stroke-width="3"/>
    <text x="800" y="1797" text-anchor="middle" font-size="38" font-weight="700" fill="#172033">結論</text>
    <text x="800" y="1846" text-anchor="middle" font-size="32" fill="#172033">三個病因方向各能否由常規檢驗回推</text>
  </g>
</svg>
