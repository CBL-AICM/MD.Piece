    <text class="zh body" style="font-family:PMingLiU,新細明體;fill:#222;font-size:22px" x="185" y="733.2" text-anchor="middle">數位雙生模擬</text><text class="mix small" style="font-family:Times New Roman,PMingLiU,新細明體;fill:#222;font-size:18px" x="595" y="723.8" text-anchor="middle"><tspan x="595">感染線索保留：MD. Piece 37%，</tspan><tspan x="595" dy="24">病人回憶 11%</tspan></text><text class="mix small" style="font-family:Times New Roman,PMingLiU,新細明體;fill:#222;font-size:18px" x="1210" y="735.8" text-anchor="middle">3,200 位虛擬病患，AUROC 約 0.77</text>
    <text class="zh body" style="font-family:PMingLiU,新細明體;fill:#222;font-size:22px" x="185" y="800.2" text-anchor="middle">真實縱向資料</text><text class="zh small" style="font-family:PMingLiU,新細明體;fill:#222;font-size:19px" x="595" y="801.2" text-anchor="middle">（無）</text><text class="mix small" style="font-family:Times New Roman,PMingLiU,新細明體;fill:#222;font-size:18px" x="1210" y="790.8" text-anchor="middle"><tspan x="1210">NHEFS 2,486 位成人，</tspan><tspan x="1210" dy="24">長期紀錄 AUROC 0.71</tspan></text>
    <text class="zh body" style="font-family:PMingLiU,新細明體;fill:#222;font-size:22px" x="185" y="867.2" text-anchor="middle">量表研究</text><text class="zh small" style="font-family:PMingLiU,新細明體;fill:#222;font-size:19px" x="595" y="856.2" text-anchor="middle"><tspan x="595">醫護接受度與情境量表</tspan><tspan x="595" dy="24">（未來工作，須經倫理審查）</tspan></text><text class="zh small" style="font-family:PMingLiU,新細明體;fill:#222;font-size:19px" x="1210" y="869.2" text-anchor="middle">（無）</text>
