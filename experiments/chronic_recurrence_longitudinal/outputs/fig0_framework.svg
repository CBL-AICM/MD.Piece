  <rect class="accent" style="fill:#eef4fa;stroke:#2f6fae;stroke-width:2.5" x="880" y="330" width="600" height="120" rx="5"/><text class="zh title" style="font-family:PMingLiU,新細明體;fill:#222;font-size:28px;font-weight:bold" x="1180" y="365.8" text-anchor="middle">假說一　醫病溝通</text><text class="zh body" style="font-family:PMingLiU,新細明體;fill:#222;font-size:22px" x="1180" y="413.7" text-anchor="middle">診前報告縮小醫病之間的資訊落差</text>

