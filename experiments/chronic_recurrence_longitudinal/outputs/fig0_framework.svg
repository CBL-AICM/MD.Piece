  <path class="line" style="fill:none;stroke:#555;stroke-width:2.5;marker-end:url(#arrow)" d="M385 210 H445"/><path class="line" style="fill:none;stroke:#555;stroke-width:2.5;marker-end:url(#arrow)" d="M755 210 H815"/><path class="line" style="fill:none;stroke:#555;stroke-width:2.5;marker-end:url(#arrow)" d="M1125 210 H1185"/>
