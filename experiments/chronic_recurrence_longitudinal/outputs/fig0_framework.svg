    <text class="zh body" style="font-family:PMingLiU,新細明體;fill:#222;font-size:22px" x="230" y="218.7" text-anchor="middle"><tspan x="230">每日症狀、用藥、睡眠、</tspan><tspan x="230" dy="29">情緒與生理數值</tspan></text>
    <rect class="box" style="fill:#fff;stroke:#555;stroke-width:2" x="445" y="145" width="310" height="130" rx="5"/><text class="zh title head" style="font-family:PMingLiU,新細明體;fill:#2f6fae;font-size:28px;font-weight:bold" x="600" y="178.3" text-anchor="middle">預測</text><text class="zh body" style="font-family:PMingLiU,新細明體;fill:#222;font-size:22px" x="600" y="241.2" text-anchor="middle">計算復發風險等級</text>
    <rect class="box" style="fill:#fff;stroke:#555;stroke-width:2" x="815" y="145" width="310" height="130" rx="5"/><text class="zh title head" style="font-family:PMingLiU,新細明體;fill:#2f6fae;font-size:28px;font-weight:bold" x="970" y="170.3" text-anchor="middle">解釋</text><text class="zh body" style="font-family:PMingLiU,新細明體;fill:#222;font-size:22px" x="970" y="218.7" text-anchor="middle"><tspan x="970">列出貢獻最大的</tspan><tspan x="970" dy="29">近期變化</tspan></text>
    <rect class="box" style="fill:#fff;stroke:#555;stroke-width:2" x="1185" y="145" width="310" height="130" rx="5"/><text class="zh title head" style="font-family:PMingLiU,新細明體;fill:#2f6fae;font-size:28px;font-weight:bold" x="1340" y="178.3" text-anchor="middle">摘要</text><text class="zh body" style="font-family:PMingLiU,新細明體;fill:#222;font-size:22px" x="1340" y="241.2" text-anchor="middle">產生三段式診前報告</text>
  </g>

