    <rect x="70" y="510" width="1460" height="55" fill="#2f6fae"/>
    <path d="M300 510 V900 M890 510 V900 M70 565 H1530 M70 632 H1530 M70 699 H1530 M70 766 H1530 M70 833 H1530" stroke="#777" stroke-width="1.5"/>
